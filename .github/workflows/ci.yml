name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check all Python files
        run: |
          find backend/app -name "*.py" -exec python3 -m py_compile {} +
          find collector -name "*.py" -exec python3 -m py_compile {} +
          find scripts -name "*.py" -exec python3 -m py_compile {} + 2>/dev/null || true
          find shared -name "*.py" -exec python3 -m py_compile {} +

      - name: Check for hardcoded secrets
        run: |
          ! grep -rE '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[0-9A-Z]{16})' \
            --include='*.py' --include='*.ts' --include='*.tsx' --include='*.env' \
            backend/ collector/ scripts/ shared/ frontend/ || true
