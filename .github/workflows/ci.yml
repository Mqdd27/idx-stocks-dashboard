name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build and typecheck
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend tests and API contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stocks_app
          POSTGRES_PASSWORD: stocks_app
          POSTGRES_DB: stocks
        options: >-
          --health-cmd "pg_isready -U stocks_app -d stocks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+psycopg2://stocks_app:stocks_app@127.0.0.1:5432/stocks
      ADMIN_API_TOKEN: ci-token
      CORS_ALLOWED_ORIGINS: http://localhost:3100
      AI_TRADING_ENABLED: "false"
      ADMIN_COOKIE_SECURE: "false"
      NINE_ROUTER_URL: http://127.0.0.1:9/v1
      OLLAMA_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-ci.txt
      - name: Initialize schema
        run: PGPASSWORD=stocks_app psql -h 127.0.0.1 -U stocks_app -d stocks -f scripts/schema.sql
      - name: Seed API contract data
        run: >-
          PGPASSWORD=stocks_app psql -h 127.0.0.1 -U stocks_app -d stocks -c "INSERT INTO companies (symbol, company_name) VALUES (chr(39)||chr(73)||chr(72)||chr(83)||chr(71)||chr(39), chr(39)||chr(73)||chr(68)||chr(88)||chr(32)||chr(67)||chr(111)||chr(109)||chr(112)||chr(111)||chr(115)||chr(105)||chr(116)||chr(101)||chr(39)) ON CONFLICT (symbol) DO NOTHING;"
      - name: Compile backend and scripts
        run: python -m compileall -q backend/app backend/tests scripts
      - name: Run backend tests
        env:
          PYTHONPATH: backend:.
        run: python -m unittest discover -s backend/tests -v
      - name: Smoke API contracts
        env:
          PYTHONPATH: backend:.
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8200 &
          pid=$!
          trap 'kill $pid' EXIT
          for attempt in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8200/health && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8200/api/market/overview -o /tmp/overview.json
          curl --fail --silent http://127.0.0.1:8200/api/watchlist -o /tmp/watchlist.json
          python -c 'import json; assert "gainers" in json.load(open("/tmp/overview.json")); assert "data" in json.load(open("/tmp/watchlist.json"))'
