name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [feature/desktop-pairing]
    paths: ["desktop/**"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} desktop package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles appimage,deb
          - os: macos-latest
            args: --bundles dmg
          - os: windows-latest
            args: --bundles msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Build desktop package
        working-directory: desktop/src-tauri
        run: cargo tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: stocks-desktop-${{ runner.os }}
          path: desktop/src-tauri/target/release/bundle/**
