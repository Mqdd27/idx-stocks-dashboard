name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main, feature/desktop-pairing]
    paths: ["backend/**", "collector/**", "shared/**", "scripts/**", "frontend/**", "desktop/**", ".github/workflows/desktop-build.yml"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} desktop package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles appimage,deb
          - os: macos-latest
            args: --bundles dmg
          - os: windows-latest
            args: --bundles msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -r backend/requirements-ci.txt
      - name: Build static frontend
        working-directory: frontend
        env:
          NEXT_OUTPUT: export
        run: npm ci && npm run build
      - name: Prepare desktop resources
        run: python scripts/build_desktop_backend.py
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Build desktop package
        working-directory: desktop/src-tauri
        run: cargo tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: stocks-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.deb
          generate_release_notes: true
